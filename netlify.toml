[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/"
to = "/fr/"
status = 302
force = false
conditions = {Language = ["fr"]}

[[redirects]]
from = "/"
to = "/en/"
status = 302
force = false

[[redirects]]
from = "/en/contact/"
to = "/en/#contact"
status = 301

[[redirects]]
from = "/fr/contact/"
to = "/fr/#contact"
status = 301

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
